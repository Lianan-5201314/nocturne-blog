<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星舞互娱 · 发文台</title>
<style>
  :root{
    --bg:#0e0e13;
    --bg-soft:#14141c;
    --card:#181822;
    --card-2:#1f1f2b;
    --line:#2a2a38;
    --text:#e9e9f2;
    --muted:#8b8ba1;
    --accent:#7c5cff;
    --accent-2:#a78bfa;
    --green:#3ddc97;
    --red:#ff5c7a;
    --amber:#ffb454;
    --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(124,92,255,.18), transparent 60%),
      radial-gradient(700px 400px at 0% 0%, rgba(61,220,151,.06), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}
  ::selection{background:rgba(124,92,255,.35)}

  /* ---------- top bar ---------- */
  .top{
    position:sticky;top:0;z-index:30;
    backdrop-filter:blur(14px);
    background:rgba(14,14,19,.78);
    border-bottom:1px solid var(--line);
  }
  .top-in{
    max-width:1120px;margin:0 auto;padding:14px 22px;
    display:flex;align-items:center;gap:14px;
  }
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .logo{
    width:34px;height:34px;border-radius:11px;flex:none;
    background:linear-gradient(140deg,#7c5cff,#4c2fd6);
    display:grid;place-items:center;font-weight:700;font-size:15px;
    box-shadow:0 6px 18px rgba(124,92,255,.35);
  }
  .brand-t{font-size:15px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
  .brand-s{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .dot.ok{background:var(--green);box-shadow:0 0 0 3px rgba(61,220,151,.14)}
  .dot.bad{background:var(--red);box-shadow:0 0 0 3px rgba(255,92,122,.14)}
  .ghost{
    border:1px solid var(--line);background:transparent;color:var(--muted);
    padding:7px 12px;border-radius:10px;font-size:12.5px;cursor:pointer;transition:.16s;
    white-space:nowrap;
  }
  .ghost:hover{color:var(--text);border-color:#3a3a4d;background:rgba(255,255,255,.03)}

  /* ---------- layout ---------- */
  .wrap{max-width:1120px;margin:0 auto;padding:26px 22px 80px;display:grid;grid-template-columns:minmax(0,1fr) 318px;gap:22px;align-items:start}

  /* ---------- composer ---------- */
  .composer{
    background:linear-gradient(180deg,#1a1a25,#171721);
    border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 24px 60px rgba(0,0,0,.35);
    overflow:hidden;
  }
  .compose-head{display:flex;gap:12px;padding:18px 20px 0}
  .avatar{
    width:42px;height:42px;border-radius:50%;flex:none;
    background:url('/avatar.jpg') center/cover,#26263a;
    border:1px solid rgba(255,255,255,.08);
  }
  .compose-main{flex:1;min-width:0}
  .hint{font-size:12px;color:var(--muted);padding:4px 0 10px;display:flex;gap:8px;align-items:center}
  .hint b{color:var(--accent-2);font-weight:600}

  #text{
    width:100%;min-height:150px;max-height:60vh;resize:none;
    background:transparent;border:0;outline:0;color:var(--text);
    font-size:15.5px;line-height:1.75;font-family:inherit;
    caret-color:var(--accent-2);
  }
  #text::placeholder{color:#5c5c72}

  .preview{
    display:none;min-height:150px;padding:2px 0 10px;
    font-size:15px;line-height:1.8;color:#dcdcea;word-wrap:break-word;
  }
  .preview img{max-width:100%;border-radius:12px;display:block;margin:10px 0}
  .preview h1,.preview h2,.preview h3{margin:14px 0 8px;line-height:1.35}
  .preview h1{font-size:20px}.preview h2{font-size:17.5px}.preview h3{font-size:16px}
  .preview p{margin:0 0 10px}
  .preview code{background:#26263a;padding:2px 6px;border-radius:6px;font-size:13px}
  .preview pre{background:#101018;border:1px solid var(--line);padding:12px 14px;border-radius:12px;overflow:auto}
  .preview pre code{background:none;padding:0}
  .preview blockquote{margin:0 0 10px;padding-left:12px;border-left:3px solid var(--accent);color:#b9b9cc}
  .preview ul,.preview ol{padding-left:20px;margin:0 0 10px}
  .preview a{color:var(--accent-2);border-bottom:1px solid rgba(167,139,250,.35)}

  /* attachments */
  .attach{display:flex;flex-wrap:wrap;gap:10px;padding:0 20px}
  .thumb{position:relative;width:82px;height:82px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb button{
    position:absolute;top:3px;right:3px;width:19px;height:19px;border-radius:50%;
    border:0;background:rgba(0,0,0,.66);color:#fff;font-size:12px;line-height:1;cursor:pointer;
  }

  /* toolbar */
  .tools{
    display:flex;align-items:center;gap:4px;flex-wrap:wrap;
    padding:6px 14px 12px;border-top:1px solid rgba(255,255,255,.04);
  }
  .tool{
    border:0;background:transparent;color:var(--muted);cursor:pointer;
    padding:7px 10px;border-radius:9px;font-size:12.5px;display:flex;align-items:center;gap:6px;transition:.15s;
  }
  .tool:hover{background:rgba(124,92,255,.12);color:#cfc6ff}
  .tool svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .count{margin-left:auto;font-size:12px;color:#616178;font-variant-numeric:tabular-nums}
  .count.warn{color:var(--amber)}

  /* settings */
  .settings{padding:0 20px;max-height:0;overflow:hidden;transition:max-height .28s ease}
  .settings.open{max-height:520px}
  .settings-in{border-top:1px dashed var(--line);padding:16px 0 6px;display:grid;gap:13px}
  .field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px;letter-spacing:.4px}
  .field input{
    width:100%;background:#101018;border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;color:var(--text);font-size:13.5px;outline:0;transition:.15s;font-family:inherit;
  }
  .field input:focus{border-color:#4a3b8f;box-shadow:0 0 0 3px rgba(124,92,255,.12)}
  .field input::placeholder{color:#55556b}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .covers{display:flex;gap:8px;flex-wrap:wrap}
  .cov{
    width:52px;height:34px;border-radius:7px;overflow:hidden;border:2px solid transparent;
    cursor:pointer;opacity:.55;transition:.15s;background:#22222f;padding:0;
  }
  .cov img{width:100%;height:100%;object-fit:cover;display:block}
  .cov:hover{opacity:.85}
  .cov.sel{border-color:var(--accent);opacity:1}
  .cov.auto{display:grid;place-items:center;font-size:10.5px;color:var(--muted);width:52px}

  /* footer */
  .compose-foot{
    display:flex;align-items:center;gap:10px;padding:12px 20px 15px;
    border-top:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.012);
  }
  .meta{font-size:11.5px;color:#5f5f76;display:flex;flex-direction:column;gap:3px}
  .actions{margin-left:auto;display:flex;gap:9px;align-items:center}
  .btn{
    border:1px solid var(--line);background:#20202c;color:#cfcfdd;
    padding:9px 16px;border-radius:11px;font-size:13px;cursor:pointer;transition:.16s;white-space:nowrap;
  }
  .btn:hover{background:#282836;color:#fff}
  .btn.primary{
    background:linear-gradient(135deg,#7c5cff,#6042e0);border-color:transparent;color:#fff;font-weight:600;
    box-shadow:0 8px 22px rgba(124,92,255,.34);
  }
  .btn.primary:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.5;cursor:not-allowed;filter:none;box-shadow:none}
  .btn .kbd{opacity:.65;font-size:10.5px;margin-left:5px}

  /* ---------- side ---------- */
  .side{display:grid;gap:16px;position:sticky;top:78px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 12px}
  .panel h3{margin:0 0 12px;font-size:12.5px;font-weight:600;color:#b9b9cc;letter-spacing:.5px;display:flex;align-items:center;gap:7px}
  .panel h3 span{font-size:11px;color:#5f5f76;font-weight:400;margin-left:auto}

  .plist{display:grid;gap:2px}
  .pitem{padding:10px 8px;border-radius:10px;display:flex;gap:10px;align-items:flex-start;transition:.15s}
  .pitem:hover{background:rgba(255,255,255,.035)}
  .pitem .pt{font-size:13px;line-height:1.45;color:#dcdcea;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .pitem .pd{font-size:10.5px;color:#5f5f76;margin-top:4px}
  .pitem .del{
    margin-left:auto;border:0;background:transparent;color:#4c4c60;cursor:pointer;font-size:11px;
    padding:2px 4px;border-radius:6px;opacity:0;transition:.15s;flex:none;
  }
  .pitem:hover .del{opacity:1}
  .pitem .del:hover{color:var(--red);background:rgba(255,92,122,.1)}
  .empty{color:#5f5f76;font-size:12.5px;padding:6px 8px 10px}

  .tips{font-size:12px;color:#7a7a92;line-height:1.85}
  .tips code{background:#22222f;padding:1.5px 5px;border-radius:5px;font-size:11.5px;color:#b7a8ff}
  .tips kbd{background:#22222f;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;font-size:10.5px;color:#c9c9d8}

  /* ---------- toast + result ---------- */
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
    background:#23232f;border:1px solid var(--line);color:var(--text);
    padding:11px 18px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;
    transition:.22s;z-index:80;box-shadow:0 16px 40px rgba(0,0,0,.45);max-width:86vw;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.err{border-color:rgba(255,92,122,.4);color:#ffc2cd}

  .result{
    display:none;margin-top:14px;border:1px solid rgba(61,220,151,.28);
    background:linear-gradient(180deg,rgba(61,220,151,.07),rgba(61,220,151,.02));
    border-radius:14px;padding:14px 16px;
  }
  .result.show{display:block}
  .result.bad{border-color:rgba(255,180,84,.3);background:rgba(255,180,84,.06)}
  .result-t{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
  .result-t .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:rgba(61,220,151,.18);color:var(--green)}
  .result.bad .result-t .ic{background:rgba(255,180,84,.18);color:var(--amber)}
  .result-u{
    display:flex;align-items:center;gap:8px;margin-top:9px;background:#101018;
    border:1px solid var(--line);border-radius:9px;padding:8px 10px;
  }
  .result-u a{font-size:12px;color:var(--accent-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .copy{border:1px solid var(--line);background:#20202c;color:#b9b9cc;border-radius:7px;font-size:11px;padding:4px 9px;cursor:pointer;flex:none}
  .copy:hover{color:#fff}
  .steps{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
  .steps li{font-size:12px;color:#9a9ab2;display:flex;gap:8px;align-items:baseline;line-height:1.5}
  .steps li .d{color:#5f5f76;font-size:11px;word-break:break-all}
  .steps li .s{flex:none;width:13px;text-align:center}
  .steps li.ok .s{color:var(--green)}
  .steps li.no .s{color:var(--red)}

  @media (max-width:900px){
    .wrap{grid-template-columns:1fr;padding:16px 14px 60px}
    .side{position:static}
    .top-in{padding:12px 14px}
    .brand-s{display:none}
    .row2{grid-template-columns:1fr}
    .compose-foot{flex-wrap:wrap}
    .meta{order:2;width:100%}
  }
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <div class="brand">
      <div class="logo">星</div>
      <div>
        <div class="brand-t">星舞互娱 · 发文台</div>
        <div class="brand-s">写点什么，按下发布，剩下的交给我</div>
      </div>
    </div>
    <div class="top-right">
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">检查环境…</span></div>
      <button class="ghost" id="openSite">打开博客 ↗</button>
    </div>
  </div>
</div>

<div class="wrap">
  <main>
    <section class="composer">
      <div class="compose-head">
        <div class="avatar"></div>
        <div class="compose-main">
          <div class="hint">有什么新鲜事？<b>Ctrl / ⌘ + Enter</b> 直接发布</div>
          <textarea id="text" placeholder="随手记一句公会日常，或者写一篇长文。&#10;&#10;支持 Markdown：**加粗**、`代码`、- 列表、直接粘贴截图&#10;第一行会自动作为摘要和标题。"></textarea>
          <div class="preview" id="preview"></div>
        </div>
      </div>

      <div class="attach" id="attach"></div>

      <div class="settings" id="settings">
        <div class="settings-in">
          <div class="field">
            <label>标题（留空则用第一行）</label>
            <input id="title" placeholder="例如：这周的公会战复盘">
          </div>
          <div class="row2">
            <div class="field">
              <label>标签（逗号分隔）</label>
              <input id="tags" placeholder="日常, 公会">
            </div>
            <div class="field">
              <label>分类（逗号分隔）</label>
              <input id="cats" placeholder="日常">
            </div>
          </div>
          <div class="field">
            <label>封面（不上传就随机用一张站内封面）</label>
            <div class="covers" id="covers">
              <button class="cov auto sel" data-cover="">随机</button>
            </div>
          </div>
        </div>
      </div>

      <div class="tools">
        <button class="tool" id="btnImage">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          图片
        </button>
        <button class="tool" id="btnSettings">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h7"/></svg>
          标题 / 标签 / 封面
        </button>
        <button class="tool" id="btnPreview">
          <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          预览
        </button>
        <div class="count" id="count">0 字</div>
      </div>

      <div class="compose-foot">
        <div class="meta">
          <span id="target">将发布到 xwhy.online</span>
          <span>发布后约 1~2 分钟上线</span>
        </div>
        <div class="actions">
          <button class="btn" id="btnDraft">存草稿</button>
          <button class="btn primary" id="btnPublish">发布<span class="kbd">⌘↵</span></button>
        </div>
      </div>

      <div style="padding:0 20px 18px">
        <div class="result" id="result">
          <div class="result-t"><span class="ic" id="rIc">✓</span><span id="rTitle">发布成功</span></div>
          <div class="result-u" id="rUrlWrap" style="display:none">
            <a id="rUrl" href="#" target="_blank" rel="noopener"></a>
            <button class="copy" id="rCopy">复制</button>
          </div>
          <button class="btn" id="rRetry" style="display:none;margin-top:10px">重试推送</button>
          <ul class="steps" id="steps"></ul>
        </div>
      </div>
    </section>
  </main>

  <aside class="side">
    <div class="panel">
      <h3>最近发布 <span id="postCount"></span></h3>
      <div class="plist" id="plist"><div class="empty">加载中…</div></div>
    </div>
    <div class="panel">
      <h3>小提示</h3>
      <div class="tips">
        · 直接 <kbd>Ctrl</kbd>+<kbd>V</kbd> 粘贴截图，会自动上传并插入<br>
        · 只写一两句也能发，就是一条动态<br>
        · 草稿存在 <code>source/_drafts</code>，不会上线<br>
        · 发布 = 写文件 + git commit + push，Actions 自动部署
      </div>
    </div>
  </aside>
</div>

<input type="file" id="fileInput" accept="image/*" multiple hidden>
<div class="toast" id="toast"></div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var state = { covers: [], files: [], cover: '', busy: false, site: 'https://xwhy.online' };

  function toast(msg, isErr){
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(t._tm);
    t._tm = setTimeout(function(){ t.className = 'toast'; }, 2600);
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  /* ---------- markdown mini renderer ---------- */
  function md(src){
    var text = String(src || '');
    var blocks = [];
    text = text.replace(/```([a-zA-Z0-9]*)\n([\s\S]*?)```/g, function(_, lang, code){
      blocks.push('<pre><code>' + esc(code.replace(/\n$/, '')) + '</code></pre>');
      return '\u0000' + (blocks.length - 1) + '\u0000';
    });
    var lines = text.split(/\r?\n/);
    var out = [], list = null, para = [];

    function flushPara(){
      if (para.length){ out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; }
    }
    function flushList(){
      if (list){ out.push('<' + list.type + '>' + list.items.map(function(i){ return '<li>' + inline(i) + '</li>'; }).join('') + '</' + list.type + '>'); list = null; }
    }

    lines.forEach(function(raw){
      var line = raw.trim();
      if (!line){ flushPara(); flushList(); return; }
      if (/^\u0000\d+\u0000$/.test(line)){ flushPara(); flushList(); out.push(line); return; }
      if (/^#{1,3}\s+/.test(line)){
        flushPara(); flushList();
        var lv = line.match(/^#+/)[0].length;
        out.push('<h' + lv + '>' + inline(line.replace(/^#+\s+/, '')) + '</h' + lv + '>');
        return;
      }
      if (/^>\s?/.test(line)){ flushPara(); flushList(); out.push('<blockquote>' + inline(line.replace(/^>\s?/, '')) + '</blockquote>'); return; }
      if (/^!\[[^\]]*\]\([^)]+\)$/.test(line)){ flushPara(); flushList(); out.push(inline(line)); return; }
      if (/^[-*+]\s+/.test(line)){
        flushPara();
        if (!list || list.type !== 'ul'){ flushList(); list = { type:'ul', items:[] }; }
        list.items.push(line.replace(/^[-*+]\s+/, ''));
        return;
      }
      if (/^\d+\.\s+/.test(line)){
        flushPara();
        if (!list || list.type !== 'ol'){ flushList(); list = { type:'ol', items:[] }; }
        list.items.push(line.replace(/^\d+\.\s+/, ''));
        return;
      }
      if (list){ flushList(); }
      para.push(line);
    });
    flushPara(); flushList();

    var html = out.join('\n').replace(/\u0000(\d+)\u0000/g, function(_, i){ return blocks[+i]; });
    return html;
  }

  function inline(s){
    return esc(s)
      .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function(_, alt, src){
        var real = src.replace(/^\/images\//, '/files/images/');
        return '<img alt="' + alt + '" src="' + real + '">';
      })
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\n/g, '<br>');
  }

  /* ---------- autosize ---------- */
  var text = $('text');
  function autosize(){
    text.style.height = 'auto';
    text.style.height = Math.min(text.scrollHeight, window.innerHeight * 0.6) + 'px';
    var n = text.value.replace(/\s/g, '').length;
    $('count').textContent = n + ' 字';
    $('count').className = 'count' + (n > 2000 ? ' warn' : '');
  }
  text.addEventListener('input', autosize);

  /* ---------- attachments ---------- */
  function renderAttach(){
    $('attach').innerHTML = state.files.map(function(f, i){
      return '<div class="thumb"><img src="' + f.preview + '"><button data-i="' + i + '" title="移除">×</button></div>';
    }).join('');
    Array.prototype.forEach.call($('attach').querySelectorAll('button'), function(b){
      b.onclick = function(e){ e.preventDefault(); state.files.splice(+b.dataset.i, 1); renderAttach(); refreshBody(); };
    });
  }

  function refreshBody(){
    var base = text.value;
    var extra = state.files.filter(function(f){ return f.path; }).map(function(f){ return '\n![](' + f.path + ')'; }).join('');
    return base + extra;
  }

  function u8ToB64(arr){
    var s = '';
    for (var i = 0; i < arr.length; i++) s += String.fromCharCode(arr[i]);
    return btoa(s);
  }

  function addImageFile(file){
    if (!/^image\//.test(file.type)) return Promise.resolve();
    return new Promise(function(resolve){
      var fr = new FileReader();
      fr.onload = function(){
        var dataUrl = fr.result;
        var local = { preview: dataUrl, path: '' };
        state.files.push(local);
        renderAttach();
        fetch('/api/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: file.name || 'paste.png', dataUrl: dataUrl })
        }).then(function(r){ return r.json(); }).then(function(j){
          if (j.ok){
            local.path = j.path;
            renderAttach();
            toast('图片已上传');
          } else {
            toast(j.error || '上传失败', true);
          }
          resolve();
        }).catch(function(){ toast('上传失败', true); resolve(); });
      };
      fr.readAsDataURL(file);
    });
  }

  $('btnImage').onclick = function(){ $('fileInput').click(); };
  $('fileInput').onchange = function(){
    Array.prototype.forEach.call(this.files, addImageFile);
    this.value = '';
  };
  text.addEventListener('paste', function(e){
    var items = (e.clipboardData || {}).items || [];
    for (var i = 0; i < items.length; i++){
      if (items[i].type.indexOf('image') === 0){
        e.preventDefault();
        addImageFile(items[i].getAsFile());
      }
    }
  });
  text.addEventListener('dragover', function(e){ e.preventDefault(); });
  text.addEventListener('drop', function(e){
    e.preventDefault();
    Array.prototype.forEach.call(e.dataTransfer.files, addImageFile);
  });

  /* ---------- settings ---------- */
  $('btnSettings').onclick = function(){
    $('settings').classList.toggle('open');
  };

  $('btnPreview').onclick = function(){
    var pv = $('preview');
    var on = pv.style.display === 'block';
    if (on){
      pv.style.display = 'none';
      text.style.display = 'block';
      $('btnPreview').style.color = '';
    } else {
      pv.innerHTML = md(refreshBody()) || '<span style="color:#5f5f76">还没有内容</span>';
      pv.style.display = 'block';
      text.style.display = 'none';
      $('btnPreview').style.color = '#cfc6ff';
    }
  };

  function renderCovers(){
    var box = $('covers');
    box.innerHTML = '<button class="cov auto sel" data-cover="">随机</button>' + state.covers.map(function(c){
      return '<button class="cov" data-cover="' + c + '" title="' + c + '"><img src="/files' + c + '"></button>';
    }).join('');
    Array.prototype.forEach.call(box.querySelectorAll('.cov'), function(b){
      b.onclick = function(){
        state.cover = b.dataset.cover;
        Array.prototype.forEach.call(box.querySelectorAll('.cov'), function(x){ x.classList.remove('sel'); });
        b.classList.add('sel');
      };
    });
  }

  /* ---------- publish ---------- */
  function insertSteps(log){
    $('steps').innerHTML = log.map(function(l){
      return '<li class="' + (l.ok ? 'ok' : 'no') + '"><span class="s">' + (l.ok ? '✓' : '×') + '</span>' +
             '<span>' + esc(l.step) + (l.detail ? ' <span class="d">' + esc(l.detail) + '</span>' : '') + '</span></li>';
    }).join('');
  }

  function setBusy(v){
    state.busy = v;
    $('btnPublish').disabled = v;
    $('btnDraft').disabled = v;
    $('btnPublish').innerHTML = v ? '发布中…' : '发布<span class="kbd">⌘↵</span>';
  }

  function submit(draft){
    if (state.busy) return;
    var body = refreshBody().trim();
    if (!body){ toast('先写点内容吧', true); text.focus(); return; }

    var tags = $('tags').value.split(/[,，\s]+/).filter(Boolean);
    var cats = $('cats').value.split(/[,，\s]+/).filter(Boolean);
    if (tags.length) localStorage.setItem('poster.tags', tags.join(','));
    if (cats.length) localStorage.setItem('poster.cats', cats.join(','));

    setBusy(true);
    $('result').className = 'result show';
    $('rTitle').textContent = draft ? '正在保存草稿…' : '正在发布…';
    $('rIc').textContent = '…';
    $('rUrlWrap').style.display = 'none';
    $('rRetry').style.display = 'none';
    $('steps').innerHTML = '';

    fetch('/api/publish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        title: $('title').value.trim(),
        content: body,
        tags: tags,
        categories: cats,
        cover: state.cover,
        draft: !!draft,
        uploaded: state.files.filter(function(f){ return f.path; }).length
      })
    }).then(function(r){ return r.json(); }).then(function(j){
      setBusy(false);
      if (!j.ok && j.error && !j.log){
        $('rTitle').textContent = '发布失败';
        $('rIc').textContent = '×';
        $('result').className = 'result show bad';
        toast(j.error, true);
        return;
      }
      insertSteps(j.log || []);
      var good = j.pushed || j.draft;
      $('result').className = 'result show' + (good ? '' : ' bad');
      $('rIc').textContent = good ? '✓' : '!';
      $('rTitle').textContent = j.draft ? '草稿已保存（未上线）' : (j.pushed ? '发布成功，正在部署' : '已保存，但推送失败');

      if (j.url && !j.draft){
        $('rUrlWrap').style.display = 'flex';
        $('rUrl').href = j.url;
        $('rUrl').textContent = j.url;
      }
      if (!j.draft && !j.pushed) $('rRetry').style.display = 'inline-block';
      if (j.file){
        text.value = '';
        $('title').value = '';
        state.files = [];
        renderAttach();
        autosize();
      }
      if (good){
        if (j.draft) toast('草稿已保存到 source/_drafts');
        else { toast('发布成功，约 1~2 分钟后上线'); loadPosts(); }
      } else {
        toast(j.error || '推送失败', true);
        if (j.file && !j.draft) loadPosts();
      }
    }).catch(function(e){
      setBusy(false);
      toast('请求失败：' + e.message, true);
      $('rIc').textContent = '×';
      $('rTitle').textContent = '发布失败';
    });
  }

  $('btnPublish').onclick = function(){ submit(false); };
  $('btnDraft').onclick = function(){ submit(true); };
  document.addEventListener('keydown', function(e){
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter'){ e.preventDefault(); submit(false); }
  });
  $('rCopy').onclick = function(){
    var u = $('rUrl').textContent;
    navigator.clipboard.writeText(u).then(function(){ toast('链接已复制'); }, function(){ toast('复制失败，手动选中吧', true); });
  };

  $('rRetry').onclick = function(){
    var btn = $('rRetry');
    btn.disabled = true;
    btn.textContent = '推送中…';
    fetch('/api/push', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
      .then(function(r){ return r.json(); }).then(function(j){
        btn.disabled = false;
        btn.textContent = '重试推送';
        if (j.pushed){
          btn.style.display = 'none';
          $('result').className = 'result show';
          $('rIc').textContent = '✓';
          $('rTitle').textContent = '发布成功，正在部署';
          toast('推送成功，约 1~2 分钟后上线');
          loadPosts();
        } else {
          toast(j.error || '推送失败', true);
        }
      }).catch(function(e){ btn.disabled = false; btn.textContent = '重试推送'; toast('请求失败：' + e.message, true); });
  };

  /* ---------- posts ---------- */
  function loadPosts(){
    fetch('/api/posts').then(function(r){ return r.json(); }).then(function(j){
      var posts = (j.posts || []).slice(0, 8);
      $('postCount').textContent = posts.length ? posts.length + ' 篇' : '';
      if (!posts.length){ $('plist').innerHTML = '<div class="empty">还没有文章</div>'; return; }
      $('plist').innerHTML = posts.map(function(p){
        return '<div class="pitem"><div style="min-width:0">' +
          '<div class="pt">' + esc(p.title) + '</div>' +
          '<div class="pd">' + esc((p.date || '').slice(0, 16)) + ' · ' + (p.words || 0) + ' 字</div>' +
          '</div><button class="del" data-file="' + esc(p.file) + '" title="删除">删除</button></div>';
      }).join('');
      Array.prototype.forEach.call($('plist').querySelectorAll('.del'), function(b){
        b.onclick = function(){
          var f = b.dataset.file;
          if (!confirm('删除《' + f + '》？会同时从线上移除。')) return;
          b.textContent = '…';
          fetch('/api/delete', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ file: f })
          }).then(function(r){ return r.json(); }).then(function(j){
            if (j.ok){ toast(j.pushed ? '已删除并推送' : '已删除，但推送失败', !j.pushed); loadPosts(); }
            else { toast(j.error || '删除失败', true); b.textContent = '删除'; }
          });
        };
      });
    }).catch(function(){ $('plist').innerHTML = '<div class="empty">读取失败</div>'; });
  }

  fetch('/api/config').then(function(r){ return r.json(); }).then(function(j){
    state.covers = j.covers || [];
    state.site = (j.site && j.site.url) || state.site;
    $('target').textContent = '将发布到 ' + state.site.replace(/^https?:\/\//, '');
    $('dot').className = 'dot ok';
    $('statusText').textContent = '已连接 · ' + (j.branch || 'main');
    renderCovers();
    if (j.posts) {
      $('postCount').textContent = j.posts.length ? j.posts.length + ' 篇' : '';
    }
    loadPosts();
  }).catch(function(){
    $('dot').className = 'dot bad';
    $('statusText').textContent = '未连接';
  });

  $('openSite').onclick = function(){ window.open(state.site, '_blank'); };
  $('tags').value = localStorage.getItem('poster.tags') || '';
  $('cats').value = localStorage.getItem('poster.cats') || '日常';
  autosize();
  setTimeout(function(){ text.focus(); }, 200);
})();
</script>
</body>
</html>
