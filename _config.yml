# ---------------------------------------------------------------
# Hexo 主配置
# 文档：https://hexo.io/zh-cn/docs/configuration
# 主题：ShokaX 0.5（配置在 _config.shokax.yml）
# ---------------------------------------------------------------

# 站点信息
title: 星舞互娱
subtitle: '深夜编码手记'
description: '在终端与夜色之间，记录构建互联网的每一个细节：前端工程、性能优化与界面设计。'
keywords: 前端,性能优化,CSS,TypeScript,设计系统
author: 像素
language: zh-CN
timezone: 'Asia/Shanghai'

# 网址
# 换域名后只改这一行：url: https://xwhy.live
url: https://nocturne-blog.app.workbuddy.host
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

# 目录
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# 写作
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

# 代码高亮：交给 ShokaX 自己处理，Hexo 内置高亮必须关掉
# Hexo >= 7 用 syntax_highlighter: false；6.x 则用 highlight.enable / prismjs.enable
syntax_highlighter: false

# 首页与分页
index_generator:
  path: ''
  per_page: 6
  order_by: -date

default_category: 未分类
category_map:
tag_map:

# 日期
date_format: YYYY-MM-DD
time_format: HH:mm
updated_option: 'date'

# 分页
per_page: 6
pagination_dir: page

# 包含 / 排除
include:
exclude:
ignore:

# 主题
theme: shokax

# Markdown 渲染（ShokaX 使用 markdown-it，目录与锚点类名必须是 toc / anchor）
markdown:
  render:
    html: false
    xhtmlOut: true
    breaks: true
    linkify: true
    typographer:
    quotes: "“”‘’"
  plugins:
    - plugin:
        name: markdown-it-toc-and-anchor
        enable: true
        options:
          tocClassName: "toc"
          anchorClassName: "anchor"
    - plugin:
        name: markdown-it-multimd-table
        enable: true
        options:
          multiline: true
          rowspan: true
          headerless: true

# RSS / Atom / JSON Feed（由 hexo-feed 生成，模板来自主题）
feed:
  limit: 20
  order_by: "-date"
  tag_dir: false
  category_dir: false
  rss:
    enable: true
    template: "node_modules/hexo-theme-shokax/layout/_alternate/rss.ejs"
    output: "rss.xml"
  atom:
    enable: true
    template: "node_modules/hexo-theme-shokax/layout/_alternate/atom.ejs"
    output: "atom.xml"
  jsonFeed:
    enable: true
    template: "node_modules/hexo-theme-shokax/layout/_alternate/json.ejs"
    output: "feed.json"

# 部署
# 默认走 .github/workflows/deploy.yml 自动发布，这里留空即可。
deploy:
  type: ''
